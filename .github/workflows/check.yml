name: 检查

on:
  pull_request:
  push:
    branches: [main]
  # 手动入口：想合并前跑一遍冒烟时，从这里触发（冒烟作业只在 Dependabot 的 PR 和手动触发时跑）。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: geraldpeng6/wonton-plugin-template/.github/workflows/plugin-check.yml@ae9307f0ffdb1fc29a64782303a859b5c3330607
    with:
      # 清单用了 spec 0.11 的 notify（发信变量 WONTON_SMTP_*），套件默认的核心镜像还没有这些能力：
      # 检查用带内部邮箱的核心构建。
      core-image: ghcr.io/wontonapp/wonton-core:main
